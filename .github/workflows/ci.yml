name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linecopilot
          POSTGRES_PASSWORD: linecopilot
          POSTGRES_DB: linecopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linecopilot -d linecopilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LINECOPILOT_TEST_DB_URL: postgresql://linecopilot:linecopilot@localhost:5432/linecopilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.14"
      - run: uv sync --frozen --python 3.12
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # dbt build on the fixtures runs inside the db-marked pytest fixtures, so there is no separate dbt step.
      - name: pytest (offline and database tests, one coverage gate)
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: pip-audit
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt --no-deps --disable-pip

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        run: docker build -t line-loss-copilot-api .
      - name: build web image
        run: docker build -t line-loss-copilot-web web
