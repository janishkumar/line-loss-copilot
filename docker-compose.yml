services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: linecopilot
      POSTGRES_PASSWORD: linecopilot
      POSTGRES_DB: linecopilot
    ports:
      - "${LINECOPILOT_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linecopilot -d linecopilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
