services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: linecopilot
      POSTGRES_PASSWORD: linecopilot
      POSTGRES_DB: linecopilot
    ports:
      - "127.0.0.1:${LINECOPILOT_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linecopilot -d linecopilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      LINECOPILOT_DB_URL: postgresql://linecopilot:linecopilot@db:5432/linecopilot
      # dev-only credentials for the restricted agent role (see sql/actions_schema.sql)
      LINECOPILOT_AGENT_DB_URL: postgresql://linecopilot_agent:linecopilot_agent@db:5432/linecopilot
      LINECOPILOT_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # stage 5: inspection heatmaps and the original VisA images, served read-only by id
      - ./data/vision:/app/data/vision:ro
      - ./data/visa:/app/data/visa:ro
    ports:
      - "127.0.0.1:${LINECOPILOT_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "127.0.0.1:${LINECOPILOT_WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
