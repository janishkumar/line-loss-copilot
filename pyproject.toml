[project]
name = "linecopilot"
version = "0.1.0"
description = "Data layer, OEE and copilot for a factory line"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linecopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: needs a Postgres database (LINECOPILOT_TEST_DB_URL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
