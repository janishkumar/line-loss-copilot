[project]
name = "linecopilot"
version = "0.1.0"
description = "Data layer, OEE and copilot for a factory line"
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.11.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "ortools>=9.15.6755",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "pip-audit>=2.7",
    {include-group = "vision"},
]
# Stage 5 (visual inspection). Kept out of [project].dependencies so the API image, which
# installs with --no-dev, never pulls torch. Dev and CI get it through the dev group.
vision = [
    "torch>=2.5",
    "torchvision>=0.20",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "pillow>=10",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linecopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# OR-Tools 9.15 (sat/python/cp_model.py) uses `~False` and `~True`; remove once it is fixed upstream.
filterwarnings = [
    "ignore:Bitwise inversion '~' on bool is deprecated:DeprecationWarning",
]
markers = [
    "db: needs a Postgres database (LINECOPILOT_TEST_DB_URL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# CPU-only torch on Linux (CI): the default Linux wheels pull about 40 CUDA packages. macOS
# keeps the PyPI wheels, which already run on CPU and Apple silicon.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
