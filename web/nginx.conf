server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # local model answers can take a minute or more
  location = /api/chat {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # hashed bundles can be cached; the page that names them must be revalidated, or a browser
  # keeps running the previous build after an image rebuild
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
